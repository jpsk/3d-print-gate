# One line per quantity or setting. Layer 1 is stl/*.stl (one solid,
# bed at z = 0). This file is layer 2. Supports stay off.
# print-gate/build_print_project.py reads this and writes the 3MF files.

printer: Bambu Lab X1 Carbon
nozzle: 0.4 mm
bed_mm: 256
filament: PETG
layer_mm: 0.2
supports: false
margin_mm: 8
gap_mm: 8
project_file: project.3mf
coupon_file: fit_coupon.3mf

plates:
  - name: Parts
    note: Replace the block with the real parts.
    parts:
      - {stl: block.stl, qty: 1, walls: 3, infill: 15, pattern: gyroid}

coupon:
  parts:
    - fit_coupon_holes.stl
    - fit_coupon_fits.stl
  walls: 2
  infill: 15
  shells: 2
  pattern: gyroid
  margin_mm: 2
  gap_mm: 6
